version: '3.8'

services:
  # -------------------------------------------------------
  # EL AGENTE (ATACANTE) - IP: 10.5.0.2
  # -------------------------------------------------------
  attacker:
    build: .                      # Usa tu Dockerfile actual
    container_name: agente-tfg
    ports:
      - "3000:5000"               # API del Agente (Host:3000 -> Container:5000)
    volumes:
      - ./script:/app             # MODO DESARROLLO: Tu carpeta 'script' es '/app' dentro
    networks:
      hacking_net:
        ipv4_address: 10.5.0.2
    command: python3 /app/agent_api.py
    tty: true                     # Mantiene el contenedor vivo
    restart: always
    depends_on:
      - victim
      - meta_victim
      - juice_victim

  # -------------------------------------------------------
  # VÍCTIMA 1: WEB CLÁSICA (DVWA) - IP: 10.5.0.3
  # -------------------------------------------------------
  victim:
    image: vulnerables/web-dvwa
    container_name: victima-dvwa
    ports:
      - "8010:80"                 # Acceso web para configurar DB (Host:8010)
    networks:
      hacking_net:
        ipv4_address: 10.5.0.3
    restart: always

  # -------------------------------------------------------
  # VÍCTIMA 2: INFRAESTRUCTURA (METASPLOITABLE) - IP: 10.5.0.4
  # -------------------------------------------------------
  meta_victim:
    image: tleemcjr/metasploitable2
    container_name: victima-meta
    ports:
      - "8030:80"                 # Web de Metasploitable (Host:8030)
    networks:
      hacking_net:
        ipv4_address: 10.5.0.4
    restart: always
    tty: true          # Simula una terminal para que no se cierre
    stdin_open: true   # Mantiene la entrada estándar abierta

  # -------------------------------------------------------
  # VÍCTIMA 3: WEB MODERNA (JUICE SHOP) - IP: 10.5.0.5
  # -------------------------------------------------------
  juice_victim:
    image: bkimminich/juice-shop
    container_name: victima-juice
    ports:
      - "8020:3000"               # Acceso web (Host:8020 -> Container:3000)
    networks:
      hacking_net:
        ipv4_address: 10.5.0.5
    restart: always

# -------------------------------------------------------
# RED AISLADA (LABORATORIO)
# -------------------------------------------------------
networks:
  hacking_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24