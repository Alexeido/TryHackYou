services:
  # -------------------------------------------------------
  # EL AGENTE (ATACANTE) - IP: 10.10.0.2
  # -------------------------------------------------------
  attacker:
    build: .
    container_name: agente-tfg
    privileged: true
    ports:
      - "5000:5000"
    volumes:
      - ./script:/app
      - persistent_storage:/workspace_persistent
      - sessions_storage:/workspace_sessions
    networks:
      hacking_net:
        ipv4_address: 10.10.0.2
    command: python3 /app/agent_api.py
    tty: true
    restart: always
    depends_on:
      - victim
      - meta_victim
      - juice_victim

  # -------------------------------------------------------
  # VÍCTIMA 1: WEB CLÁSICA (DVWA) - IP: 10.10.0.3
  # -------------------------------------------------------
  victim:
    image: vulnerables/web-dvwa
    container_name: victima-dvwa
    ports:
      - "8010:80"
    networks:
      hacking_net:
        ipv4_address: 10.10.0.3
    restart: always

  # -------------------------------------------------------
  # VÍCTIMA 2: INFRAESTRUCTURA (METASPLOITABLE) - IP: 10.10.0.4
  # -------------------------------------------------------
  meta_victim:
    image: tleemcjr/metasploitable2
    container_name: victima-meta
    ports:
      - "8030:80"
    networks:
      hacking_net:
        ipv4_address: 10.10.0.4
    restart: always
    tty: true
    stdin_open: true

  # -------------------------------------------------------
  # VÍCTIMA 3: WEB MODERNA (JUICE SHOP) - IP: 10.10.0.5
  # -------------------------------------------------------
  juice_victim:
    image: bkimminich/juice-shop
    container_name: victima-juice
    ports:
      - "8020:3000"
    networks:
      hacking_net:
        ipv4_address: 10.10.0.5
    restart: always

# -------------------------------------------------------
# RED AISLADA (LABORATORIO)
# -------------------------------------------------------
networks:
  hacking_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

# -------------------------------------------------------
# VOLÚMENES PERSISTENTES
# -------------------------------------------------------
volumes:
  persistent_storage:
  sessions_storage: